name: CI

on:
  pull_request:
  # The update workflow dispatches this on its PR branch, because pull requests
  # opened with GITHUB_TOKEN do not trigger pull_request runs.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and verify sources
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq namcap shellcheck actionlint pacman-contrib

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare unprivileged build user
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: shellcheck
        run: shellcheck --shell=bash scripts/*.sh openmouse-bridge-bin.install

      - name: actionlint
        run: actionlint -shellcheck= .github/workflows/*.yml

      - name: namcap PKGBUILD
        run: scripts/namcap-check.sh PKGBUILD

      - name: .SRCINFO is up to date
        run: runuser -u builder -- makepkg --printsrcinfo | diff -u .SRCINFO -

      - name: Package matches upstream release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/verify-upstream.sh

      - name: Desktop entry and udev rule are valid
        run: |
          pacman -S --noconfirm --needed desktop-file-utils
          desktop-file-validate openmouse-bridge.desktop
          udevadm verify --resolve-names=never 69-openmouse-bridge.rules

  build:
    name: Build package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git namcap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: makepkg (verifies every checksum)
        run: runuser -u builder -- makepkg --syncdeps --noconfirm --cleanbuild

      - name: namcap package
        run: scripts/namcap-check.sh -i ./*.pkg.tar.zst

      - name: Package listing
        run: pacman -Qlp ./*.pkg.tar.zst | grep -v '/native-hid/node_modules/' | sed 's|^[^ ]* ||'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ./*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  test:
    name: Install and run package
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm --needed git jq curl xorg-server-xvfb xorg-xauth dbus desktop-file-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Install, exercise and remove the package
        run: scripts/test-package.sh ./*.pkg.tar.zst
